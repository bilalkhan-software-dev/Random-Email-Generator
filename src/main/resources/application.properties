# Application Configuration
spring.application.name=Random-Email-Generator
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/random_email_generator
spring.datasource.username=root
spring.datasource.password=khan
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000


# Logging Configuration
logging.level.root=INFO
logging.level.com.randomEmailGenerator=DEBUG
logging.file.name=logs/random-email-generator.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# API Documentation (Swagger)
#springdoc.api-docs.path=/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html